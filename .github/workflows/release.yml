name: Release

# Builds versioned store/web artifacts. Does not publish to Play, App Store,
# or any host. Optional Android signing uses GitHub secrets when present.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(awk '/^version:/ { print $2; exit }' pubspec.yaml | cut -d+ -f1)"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; building unsigned release."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "${ANDROID_STOREPASSWORD}" "${ANDROID_KEYPASSWORD}" "${ANDROID_KEYALIAS}" \
            > android/key.properties
      - run: >
          flutter build apk --release
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ needs.version.outputs.number }}
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
      - run: >
          flutter build appbundle --release
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ needs.version.outputs.number }}
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.version.outputs.name }}+${{ needs.version.outputs.number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build web --release
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ needs.version.outputs.number }}
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ needs.version.outputs.name }}+${{ needs.version.outputs.number }}
          path: build/web/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS unsigned archive
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build ios --release --no-codesign
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ needs.version.outputs.number }}
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ needs.version.outputs.name }}+${{ needs.version.outputs.number }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 30
