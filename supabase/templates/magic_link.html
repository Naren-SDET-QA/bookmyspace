<!doctype html>
<html lang="en">
  <body style="margin:0;background:#151126;color:#ffffff;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:32px auto;padding:32px;background:#211a38;border-radius:20px">
      <h1 style="margin:0 0 12px;color:#8b5cf6">BookMySpace</h1>
      <p style="margin:0 0 24px;color:#d4cdea">Enter this verification code to log in:</p>
      <div style="font-size:34px;font-weight:700;letter-spacing:10px;padding:18px;text-align:center;background:#151126;border-radius:12px">
        {{ .Token }}
      </div>
      <p style="margin:24px 0 0;color:#9c94b5;font-size:13px">This code expires in one hour. If you did not request it, you can ignore this email.</p>
    </div>
  </body>
</html>
